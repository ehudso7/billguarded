name: Enroll BillGuarded in governance v2.5.0

on:
  push:
    branches:
      - governance/onboard-v2.5.0
    paths:
      - .github/workflows/onboard-governance-v2.5.0-once.yml

permissions:
  contents: write

env:
  EXPECTED_MAIN_SHA: 73a3196bb6f69723abe1bd25189c6450fed72a15
  GOVERNANCE_RELEASE_SHA: 6166abbce7c942ac6ac8313cfb5fbd721cd6f289
  HELPER_WORKFLOW: .github/workflows/onboard-governance-v2.5.0-once.yml

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout enrollment branch
        uses: actions/checkout@v7
        with:
          ref: governance/onboard-v2.5.0
          fetch-depth: 2

      - name: Prove exact protected-main base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Require private governance read credential
        shell: bash
        env:
          GOVERNANCE_READ_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_READ_TOKEN" || {
            echo 'STOP: GOVERNANCE_READ_TOKEN is not provisioned in BillGuarded.'
            exit 1
          }

      - name: Checkout exact governance release source
        uses: actions/checkout@v7
        with:
          repository: ehudso7/project-governance
          ref: 6166abbce7c942ac6ac8313cfb5fbd721cd6f289
          path: .governance-source
          token: ${{ secrets.GOVERNANCE_READ_TOKEN }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build exact governance tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .governance-source rev-parse HEAD)" = "$GOVERNANCE_RELEASE_SHA"
          corepack enable
          cd .governance-source
          pnpm install --frozen-lockfile
          pnpm build

      - name: Initialize BillGuarded non-destructively
        shell: bash
        run: |
          set -euo pipefail
          node .governance-source/bin/malik.mjs init \
            --root . \
            --profile web-saas \
            --project-id billguarded \
            --name BillGuarded \
            --type web-saas \
            --criticality high \
            --lifecycle active \
            --with-ci

      - name: Replace mutable release tag with exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/governance-check.yml')
          s = p.read_text()
          old = 'ref: v2.5.0'
          new = 'ref: 6166abbce7c942ac6ac8313cfb5fbd721cd6f289'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one mutable v2.5.0 source pin, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          grep -F 'ref: 6166abbce7c942ac6ac8313cfb5fbd721cd6f289' .github/workflows/governance-check.yml
          ! grep -F 'ref: v2.5.0' .github/workflows/governance-check.yml

      - name: Validate generated governance state
        shell: bash
        run: |
          set -euo pipefail
          node .governance-source/bin/malik.mjs validate --root . --strict --format json
          node .governance-source/bin/malik.mjs sync --root . --check

      - name: Run BillGuarded native verification gate
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          STRIPE_SECRET_KEY: sk_test_placeholder_for_build_only
          STRIPE_PRICE_AUDIT_90_DAY: price_placeholder_audit
          STRIPE_PRICE_CONTINUOUS_MONITOR: price_placeholder_monitor
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run check

      - name: Clean generator source and prove exact change scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .governance-source
          rm -f "$HELPER_WORKFLOW"
          git diff --check
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'GOVERNANCE.yaml',
              '.github/workflows/governance-check.yml',
              '.governance/sync-state.json',
              'CLAUDE.md',
              'AGENTS.md',
              'PROJECT.md',
              'GRAPH.md',
              'EVIDENCE.md',
              'DECISIONS.md',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          paths = []
          for line in out.splitlines():
              if not line:
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              paths.append(path)
          unexpected = sorted(set(paths) - allowed)
          missing = sorted(allowed - set(paths))
          if unexpected:
              raise SystemExit(f'unexpected enrollment paths: {unexpected}')
          if missing:
              raise SystemExit(f'expected enrollment paths missing: {missing}')
          print('Verified exact 9-file governance enrollment scope.')
          PY

      - name: Commit verified generated enrollment bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            GOVERNANCE.yaml \
            .github/workflows/governance-check.yml \
            .governance/sync-state.json \
            CLAUDE.md AGENTS.md PROJECT.md GRAPH.md EVIDENCE.md DECISIONS.md \
            "$HELPER_WORKFLOW"
          git commit -m 'chore(governance): enroll BillGuarded in v2.5.0'
          git push origin HEAD:governance/onboard-v2.5.0
