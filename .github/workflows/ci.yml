name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Commit generated lockfile on this validation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/stripe-validation-foundation'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json was not generated"
            exit 1
          fi
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock dependency graph"
          git push origin "HEAD:$HEAD_REF"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          APP_URL: https://example.com
          STRIPE_SECRET_KEY: sk_test_placeholder_for_build_only
          STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_build_only
          STRIPE_PRICE_AUDIT_90_DAY: price_placeholder_audit
          STRIPE_PRICE_CONTINUOUS_MONITOR: price_placeholder_monitor
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
          APP_SIGNING_SECRET: 0123456789abcdef0123456789abcdef
