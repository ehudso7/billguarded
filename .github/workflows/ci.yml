name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit engine regression tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          STRIPE_SECRET_KEY: sk_test_placeholder_for_build_only
          STRIPE_PRICE_AUDIT_90_DAY: price_placeholder_audit
          STRIPE_PRICE_CONTINUOUS_MONITOR: price_placeholder_monitor
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SECRET_KEY: sb_secret_placeholder
