name: Live Stripe Readiness

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      # Retry after Supabase PostgREST schema cache reload.
      - name: Wait for production and run zero-write readiness probe
        shell: bash
        run: |
          set -euo pipefail

          url="https://www.billguarded.com/api/internal/live-stripe-readiness"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          for attempt in $(seq 1 40); do
            status="$(curl --silent --show-error --location \
              --connect-timeout 5 \
              --max-time 15 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "$url" || true)"

            if [ "$status" = "200" ]; then
              cat "$body_file"
              echo
              node -e '
                const fs = require("fs");
                const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (result.ok !== true) throw new Error("live Stripe readiness returned ok=false");
                if (result.writes_performed !== 0) throw new Error("readiness probe reported a Stripe write");
                if (result.account?.id_match !== true) throw new Error("production Stripe account ID mismatch");
                if (result.account?.charges_enabled !== true) throw new Error("live charges are not enabled");
                if (result.account?.payouts_enabled !== true) throw new Error("live payouts are not enabled");
                if (result.prices?.audit_live_active_1500 !== true) throw new Error("$1,500 live audit Price mismatch");
                if (result.prices?.monitor_live_active_599_monthly !== true) throw new Error("$599/month live monitor Price mismatch");
                console.log("BILLGUARDED LIVE STRIPE READINESS: PASS");
              ' "$body_file"
              exit 0
            fi

            if [ "$status" = "500" ] || [ "$status" = "410" ]; then
              echo "Readiness probe reached production but failed with HTTP $status"
              cat "$body_file"
              echo
              exit 1
            fi

            echo "Attempt $attempt: production probe not ready yet (HTTP $status); retrying..."
            sleep 5
          done

          echo "Timed out waiting for the BillGuarded production readiness probe."
          exit 1
